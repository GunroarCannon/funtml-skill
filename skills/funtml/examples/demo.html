<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>funtml</title>
<meta name="description" content="Turn any project into a bouncy, sticker-style web page with diagrams and charts.">
<meta name="theme-color" content="#17131c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@500;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* funtml: sticker cards, hard shadows, springy motion. Four themes, all driven by the variables below. */
:root, [data-theme="wall"] {
  --on-c4: #ffffff;
  --bg: #17131c; --bg2: #241d2d; --text: #fff8ec; --muted: rgba(255,248,236,.72);
  --card: #fff8ec; --card2: #ffeef7; --card-text: #141014; --outline: #141014; --shadow-c: #000;
  --c1: #ffe14d; --c2: #ff2e88; --c3: #2de2e6; --c4: #836ef9; --c5: #b6ff3b; --c6: #ff9f1c;
  --accent: var(--c1); --on-accent: #141014; --edge: rgba(255,248,236,.7);
  --f-display: 'Fredoka', 'Nunito', system-ui, sans-serif; --f-body: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace; --display-weight: 700; --display-case: none;
  --gedge: #3b3340; --bw: 3px; --radius: 16px; --sh: 5px; --nav-bg: rgba(23,19,28,.92);
  --title-shadow: 3px 3px 0 #141014, 6px 6px 0 var(--c2);
  color-scheme: dark;
}
[data-theme="notebook"] {
  --on-c4: #141014;
  --bg: #2d2440; --bg2: #3a2f55; --text: #2b2340; --muted: #5c5470;
  --card: #ffffff; --card2: #fff6c9; --card-text: #2b2340; --outline: #2b2340; --shadow-c: rgba(43,35,64,.28);
  --c1: #fff27a; --c2: #ffb3d1; --c3: #aeeccf; --c4: #bfe0ff; --c5: #ddd0ff; --c6: #ffd2b5;
  --accent: #8b5cf6; --on-accent: #ffffff; --edge: #5c5470;
  --f-display: 'Caveat Brush', 'Patrick Hand', cursive; --f-body: 'Patrick Hand', 'Comic Sans MS', cursive;
  --f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace; --display-weight: 400; --display-case: none;
  --gedge: #5c5470; --bw: 2.5px; --radius: 12px; --sh: 4px; --nav-bg: rgba(253,249,238,.95);
  --title-shadow: 3px 3px 0 var(--c2);
  color-scheme: light;
}
[data-theme="ink"] {
  --on-c4: #141014;
  --bg: #f6f4ec; --bg2: #ebe8dc; --text: #111111; --muted: #55524a;
  --card: #ffffff; --card2: #fff6b8; --card-text: #111111; --outline: #111111; --shadow-c: #111111;
  --c1: #ffd60a; --c2: #ff5d73; --c3: #4dd4c6; --c4: #7c8cff; --c5: #9be564; --c6: #ffa24d;
  --accent: #ffd60a; --on-accent: #111111; --edge: #111111;
  --f-display: 'JetBrains Mono', ui-monospace, Consolas, monospace; --f-body: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace; --display-weight: 800; --display-case: uppercase;
  --gedge: #111; --bw: 3px; --radius: 10px; --sh: 5px; --nav-bg: rgba(246,244,236,.94);
  --title-shadow: 4px 4px 0 var(--accent);
  color-scheme: light;
}
[data-theme="blueprint"] {
  --on-c4: #141014;
  --bg: #0b2a5b; --bg2: #103572; --text: #e8f1ff; --muted: rgba(232,241,255,.74);
  --card: #0f3a7a; --card2: #14468f; --card-text: #e8f1ff; --outline: #e8f1ff; --shadow-c: #041a3d;
  --c1: #ffd60a; --c2: #ff7ab6; --c3: #5ef0e0; --c4: #9bb4ff; --c5: #b6ff7a; --c6: #ffb04d;
  --accent: #ffd60a; --on-accent: #0b2a5b; --edge: #e8f1ff;
  --f-display: 'JetBrains Mono', ui-monospace, Consolas, monospace; --f-body: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace; --display-weight: 800; --display-case: uppercase;
  --gedge: #cfe0ff; --bw: 2px; --radius: 6px; --sh: 4px; --nav-bg: rgba(11,42,91,.94);
  --title-shadow: 3px 3px 0 #041a3d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 18px; line-height: 1.45; font-weight: 500; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; }
[data-theme="wall"] body::before { opacity: .55;
  background: radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--c4) 45%, transparent), transparent 38%), radial-gradient(circle at 92% 94%, color-mix(in srgb, var(--c2) 38%, transparent), transparent 40%),
    radial-gradient(rgba(255,255,255,.04) 1px, transparent 1.3px) 0 0 / 7px 7px; }
[data-theme="ink"] body::before { opacity: 1; background: linear-gradient(rgba(17,17,17,.07) 1px, transparent 1px) 0 0 / 28px 28px, linear-gradient(90deg, rgba(17,17,17,.07) 1px, transparent 1px) 0 0 / 28px 28px; }
[data-theme="blueprint"] body::before { opacity: 1; background: linear-gradient(rgba(232,241,255,.09) 1px, transparent 1px) 0 0 / 32px 32px, linear-gradient(90deg, rgba(232,241,255,.09) 1px, transparent 1px) 0 0 / 32px 32px; }
[data-theme="notebook"] body::before { opacity: .6; background: radial-gradient(circle at 15% 20%, #3d3159, transparent 40%), radial-gradient(circle at 85% 80%, #3a2a55, transparent 45%); }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4 { margin: 0; font-family: var(--f-display); font-weight: var(--display-weight); text-transform: var(--display-case); line-height: 1.05; }
p { margin: 0 0 .8em; }
code, .mono { font-family: var(--f-mono); font-size: .88em; }
:focus-visible { outline: 3px dashed var(--accent); outline-offset: 3px; }
[data-theme="ink"] :focus-visible { outline-color: #111; }

#app { position: relative; z-index: 1; }
.page { max-width: 1120px; margin: 0 auto; padding: 0 20px 60px; position: relative; }
[data-theme="notebook"] .page { margin: 24px auto 60px; padding: 0 28px 50px 84px; background-color: #fdf9ee; border-radius: 6px 14px 14px 6px; max-width: 1180px;
  background-image: linear-gradient(90deg, transparent 62px, #ef8f8f 62px, #ef8f8f 64px, transparent 64px), repeating-linear-gradient(180deg, transparent 0, transparent 31px, #c6d8ee 31px, #c6d8ee 32px);
  box-shadow: 0 1px 0 #e7dfc8, 0 2px 0 #f6f0de, 0 3px 0 #e2d9bf, 0 24px 60px rgba(0,0,0,.45); }
[data-theme="notebook"] .page::before { content: ''; position: absolute; left: 14px; top: 30px; bottom: 30px; width: 30px; background: radial-gradient(circle at 15px 9px, #2d2440 0 7px, transparent 8px) 0 0 / 30px 46px repeat-y; opacity: .9; }

/* ---------- nav ---------- */
.nav { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 10px 0; margin: 0 -20px; padding-left: 20px; padding-right: 20px; background: var(--nav-bg); border-bottom: var(--bw) solid var(--outline); backdrop-filter: blur(6px); }
[data-theme="notebook"] .nav { margin: 0 -28px 0 -84px; padding-left: 84px; padding-right: 28px; border-radius: 6px 14px 0 0; }
.logo { font-family: var(--f-display); font-weight: var(--display-weight); text-transform: var(--display-case); font-size: 1.35rem; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; margin-right: auto; white-space: nowrap; transition: transform .2s cubic-bezier(.3,2.2,.5,1); }
.logo:hover { transform: rotate(-3deg) scale(1.07); }
.logo i { display: inline-block; width: 18px; height: 18px; border: var(--bw) solid var(--outline); border-radius: 50%; background: var(--accent); }
.pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 70vw; padding: 4px 2px; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: none; text-decoration: none; font-weight: 600; font-size: .85rem; padding: .25em .8em; border: 2px solid var(--outline); border-radius: 999px; background: var(--card); color: var(--card-text); transition: transform .15s cubic-bezier(.3,2.2,.5,1), background .15s; }
.pill:hover { transform: translateY(-3px) rotate(-3deg); background: var(--c1); color: #141014; }
.pill.on { background: var(--accent); color: var(--on-accent); transform: translateY(-2px) rotate(-2deg); box-shadow: 2px 2px 0 var(--shadow-c); }
.themebtn { flex: none; width: 36px; height: 36px; border: 2px solid var(--outline); border-radius: 50%; background: var(--card); color: var(--card-text); display: grid; place-items: center; transition: transform .2s cubic-bezier(.3,2.2,.5,1); }
.themebtn:hover { transform: rotate(90deg) scale(1.12); }
.themebtn svg { width: 20px; height: 20px; }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: 1.25fr .75fr; gap: 28px; align-items: center; padding: 56px 0 28px; position: relative; }
.hero h1 { font-size: clamp(2.6rem, 8vw, 5.6rem); color: var(--accent); text-shadow: var(--title-shadow); letter-spacing: .01em; margin-bottom: 14px; }
[data-theme="notebook"] .hero h1 { color: var(--text); text-shadow: 3px 3px 0 var(--c2); }
[data-theme="ink"] .hero h1 { color: var(--text); text-shadow: 4px 4px 0 var(--accent); }
.hero h1 .w { display: inline-block; white-space: nowrap; }
.hero h1 .l { display: inline-block; animation: letterIn .7s cubic-bezier(.2,1.8,.4,1) backwards; animation-delay: calc(var(--i) * 35ms + 100ms); cursor: default; transition: translate .25s cubic-bezier(.3,2.4,.5,1), rotate .25s cubic-bezier(.3,2.4,.5,1), scale .25s; }
.hero h1 .l:hover { translate: 0 -.18em; rotate: -7deg; scale: 1.12; }
@keyframes letterIn { from { transform: translateY(-1.2em) rotate(-25deg) scale(.4); opacity: 0; } }
.hero .tagline { font-size: clamp(1.15rem, 2.6vw, 1.55rem); font-weight: 600; max-width: 34em; margin-bottom: 16px; }
.stickers { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
.chip { display: inline-flex; align-items: center; gap: .35em; padding: .12em .7em; border: 2px solid var(--outline); border-radius: 999px; background: var(--card); color: var(--card-text); font-weight: 600; font-size: .85rem; white-space: nowrap; box-shadow: 2px 2px 0 var(--shadow-c); }
.stickers .chip { font-size: .95rem; background: var(--c1); color: #141014; animation: dropIn .6s cubic-bezier(.2,1.7,.4,1) backwards; animation-delay: calc(var(--i) * 80ms + 500ms); transition: translate .2s cubic-bezier(.3,2.4,.5,1), rotate .2s cubic-bezier(.3,2.4,.5,1), scale .2s; }
.stickers .chip:nth-child(6n+2) { background: var(--c2); } .stickers .chip:nth-child(6n+3) { background: var(--c3); } .stickers .chip:nth-child(6n+4) { background: var(--c4); color: var(--on-c4, #141014); } .stickers .chip:nth-child(6n+5) { background: var(--c5); } .stickers .chip:nth-child(6n+6) { background: var(--c6); }
.stickers .chip:nth-child(odd) { rotate: -3deg; } .stickers .chip:nth-child(even) { rotate: 2.5deg; }
.stickers .chip:hover { translate: 0 -4px; rotate: 5deg; scale: 1.1; }
.chip.dot i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--outline); background: var(--cc, var(--c1)); display: inline-block; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; padding: .6em 1.15em; border: var(--bw) solid var(--outline); border-radius: calc(var(--radius) - 2px); background: var(--accent); color: var(--on-accent); font-family: var(--f-body); font-weight: 700; font-size: 1rem; letter-spacing: .03em; text-transform: uppercase; text-decoration: none; box-shadow: 4px 4px 0 var(--shadow-c); transition: transform .12s cubic-bezier(.3,2,.5,1), box-shadow .12s; user-select: none; }
.btn:hover { transform: translate(-2px,-2px) rotate(-1.5deg) scale(1.03); box-shadow: 7px 7px 0 var(--shadow-c); animation: jiggle .5s; }
.btn:active { transform: translate(3px,3px) scale(.94,.9); box-shadow: 1px 1px 0 var(--shadow-c); animation: none; }
.btn.alt { background: var(--card); color: var(--card-text); }
.btn svg { width: 1.2em; height: 1.2em; }
@keyframes jiggle { 20% { rotate: -3deg; } 40% { rotate: 3deg; } 60% { rotate: -2deg; } 80% { rotate: 1deg; } }
@keyframes dropIn { from { transform: translateY(-60px) rotate(-8deg) scale(.8); opacity: 0; } }
.mascot-wrap { position: relative; justify-self: center; width: min(330px, 78vw); aspect-ratio: 1; animation: floaty 4.2s ease-in-out infinite; cursor: pointer; touch-action: manipulation; }
.mascot-wrap svg { width: 100%; height: 100%; overflow: visible; }
.mascot-wrap .splash { position: absolute; inset: -10%; z-index: -1; border-radius: 46% 54% 58% 42% / 52% 44% 56% 48%; background: var(--c2); opacity: .5; filter: blur(2px); animation: morph 9s ease-in-out infinite; }
.mascot-wrap .splash.b { inset: -4% -14% 8% 10%; background: var(--c3); opacity: .4; animation-delay: -4s; }
@keyframes floaty { 50% { translate: 0 -14px; } }
@keyframes morph { 50% { border-radius: 58% 42% 44% 56% / 42% 58% 44% 56%; rotate: 25deg; } }
.m-body { transform-origin: 100px 176px; animation: squish 2.6s ease-in-out infinite; }
.mascot-wrap.pop .m-body { animation: squashPop .7s cubic-bezier(.2,1.8,.4,1); }
@keyframes squish { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.04,.95); } }
@keyframes squashPop { 0% { transform: scale(1.25,.7); } 40% { transform: scale(.85,1.2); } 100% { transform: scale(1,1); } }
.m-eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
@keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } }
.hero-img { width: min(360px, 80vw); border: 5px solid var(--outline); border-radius: var(--radius); box-shadow: 8px 8px 0 var(--shadow-c); rotate: 3deg; background: #fff; transition: rotate .3s cubic-bezier(.3,2,.5,1); }
.hero-img:hover { rotate: -2deg; }

.stats-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin: 18px 0 8px; }

.ticker { margin: 26px -20px 8px; overflow: hidden; background: var(--accent); color: var(--on-accent); border-block: var(--bw) solid var(--outline); height: 44px; display: flex; align-items: center; rotate: -1deg; position: relative; }
[data-theme="notebook"] .ticker { margin: 26px -28px 8px -84px; }
.ticker .track { display: flex; gap: 40px; white-space: nowrap; padding-left: 40px; animation: tick 40s linear infinite; font-family: var(--f-display); font-weight: var(--display-weight); text-transform: var(--display-case); font-size: 1.1rem; }
.ticker:hover .track { animation-play-state: paused; }
.ticker .track span::after { content: ''; display: inline-block; width: 12px; height: 12px; margin-left: 40px; border-radius: 50%; background: var(--on-accent); opacity: .55; vertical-align: middle; }
@keyframes tick { to { transform: translateX(-50%); } }

/* ---------- sections ---------- */
.sec { padding: 52px 0 12px; position: relative; }
.sec-head { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
.sec-head .num { flex: none; width: 52px; height: 52px; display: grid; place-items: center; border: var(--bw) solid var(--outline); border-radius: 50%; background: var(--c2); color: #141014; font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; box-shadow: 3px 3px 0 var(--shadow-c); rotate: -8deg; }
.sec:nth-of-type(3n+2) .sec-head .num { background: var(--c3); } .sec:nth-of-type(3n+3) .sec-head .num { background: var(--c5); }
.sec-head h2 { font-size: clamp(1.9rem, 5vw, 3.1rem); position: relative; padding-bottom: .15em; }
.sec-head h2::after { content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 10px; background: var(--accent); opacity: .85; z-index: -1; border-radius: 6px; transform: skewX(-12deg) scaleX(0); transform-origin: left; transition: transform .7s .25s cubic-bezier(.2,1.5,.4,1); }
.sec.in h2::after { transform: skewX(-12deg) scaleX(1); }
.lede { max-width: 46em; font-size: 1.15rem; color: var(--muted); margin: 0 0 22px; }
.rv { opacity: 0; }
.rv.in { opacity: 1; animation: rise .75s cubic-bezier(.2,1.5,.4,1) backwards; animation-delay: var(--d, 0s); }
@keyframes rise { from { transform: translateY(46px) rotate(var(--r, -2deg)) scale(.9); opacity: 0; } }

.card { position: relative; background: var(--card); color: var(--card-text); border: var(--bw) solid var(--outline); border-radius: var(--radius); box-shadow: var(--sh) var(--sh) 0 var(--shadow-c); padding: 18px 18px 16px; }
.card.tape::after { content: ''; position: absolute; top: -12px; left: 50%; width: 74px; height: 22px; translate: -50% 0; rotate: -3deg; background: color-mix(in srgb, var(--c1) 80%, transparent); border: 1px solid rgba(0,0,0,.15); pointer-events: none; }
[data-theme="blueprint"] .card.tape::after { background: rgba(255,255,255,.2); }
.card h3 { font-size: 1.35rem; margin-bottom: 6px; }
.card p:last-child { margin-bottom: 0; }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 26px 22px; padding-top: 10px; }
.fcard { transition: transform .18s cubic-bezier(.3,2.2,.5,1), box-shadow .18s; rotate: var(--tilt, 0deg); }
.fcard:hover { transform: translate(-3px,-6px) rotate(calc(var(--tilt, 0deg) * -1)) scale(1.03); box-shadow: calc(var(--sh) + 3px) calc(var(--sh) + 4px) 0 var(--shadow-c); }
.fcard:hover .ico { animation: jiggle .5s; }
.ico { width: 52px; height: 52px; display: grid; place-items: center; border: var(--bw) solid var(--outline); border-radius: 14px; background: var(--ic, var(--c1)); color: #141014; margin-bottom: 10px; box-shadow: 2px 2px 0 var(--shadow-c); }
.ico svg { width: 28px; height: 28px; }
.fcard .tag { position: absolute; top: 12px; right: 12px; }

/* stats */
.stat { text-align: center; padding: 16px 10px 12px; rotate: var(--tilt, 0deg); transition: transform .18s cubic-bezier(.3,2.2,.5,1); }
.stat:hover { transform: scale(1.06) rotate(2deg); }
.stat b { display: block; font-family: var(--f-display); font-weight: var(--display-weight); font-size: clamp(2.2rem, 6vw, 3.4rem); line-height: 1; color: var(--sc, var(--c2)); text-shadow: 2px 2px 0 var(--outline); -webkit-text-stroke: 0; text-transform: none; }
[data-theme="notebook"] .stat b, [data-theme="ink"] .stat b { color: var(--card-text); text-shadow: 3px 3px 0 var(--sc, var(--c2)); }
.stat span { font-weight: 600; font-size: .95rem; opacity: .85; }

/* steps */
.steps { counter-reset: s; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 30px 24px; padding-top: 16px; }
.step { padding-top: 34px; }
.step .n { position: absolute; top: -22px; left: 14px; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; border: var(--bw) solid var(--outline); background: var(--sc, var(--c1)); color: #141014; font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; box-shadow: 3px 3px 0 var(--shadow-c); rotate: -6deg; }

/* pipeline */
.pipe { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; padding-top: 12px; row-gap: 26px; }
.pstage { flex: 1 1 170px; min-width: 150px; max-width: 280px; text-align: center; }
.pstage .ico { margin: 0 auto 8px; }
.pstage h3 { font-size: 1.15rem; }
.pstage p { font-size: .92rem; margin: 4px 0 0; opacity: .85; }
.pio { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 8px; }
.pio .chip { font-size: .72rem; box-shadow: none; padding: .05em .55em; }
.pio .chip.in { background: var(--c3); color: #141014; } .pio .chip.out { background: var(--c5); color: #141014; }
.pconn { flex: 0 0 56px; align-self: center; height: 40px; position: relative; display: grid; place-items: center; }
.pconn svg { width: 56px; height: 24px; overflow: visible; }
.pconn path.l { stroke: var(--edge); stroke-width: 3; fill: none; stroke-dasharray: 7 6; animation: march 1s linear infinite; stroke-linecap: round; }
.pconn path.h { fill: var(--edge); }
@keyframes march { to { stroke-dashoffset: -26; } }

/* layers */
.layers { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.layer { display: grid; grid-template-columns: 190px 1fr; gap: 0; border: var(--bw) solid var(--outline); border-radius: var(--radius); background: var(--card); color: var(--card-text); box-shadow: var(--sh) var(--sh) 0 var(--shadow-c); overflow: hidden; rotate: var(--tilt, 0deg); }
.layer .lname { background: var(--lc, var(--c1)); color: #141014; padding: 14px 16px; border-right: var(--bw) solid var(--outline); display: flex; flex-direction: column; justify-content: center; }
.layer .lname h3 { font-size: 1.25rem; }
.layer .lname p { font-size: .85rem; margin: 3px 0 0; opacity: .85; line-height: 1.2; }
.layer .litems { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px; align-items: center; }

/* ---------- tiny DOM helper: h('div', {class:'x', style:{'--a':1}, onclick:fn}, child, ...) ; 'svg:rect' makes SVG ---------- */
function h(tag, props, ...kids) {
  const svg = tag.startsWith('svg:');

  add(el, kids);
